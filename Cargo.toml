[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/Honfred/craftflow"

[workspace.dependencies]
# Internal crates. Dependency arrows follow DESIGN.md §3.
model = { path = "crates/model" }
expr = { path = "crates/expr" }
packs = { path = "crates/packs" }
graph = { path = "crates/graph" }
solver = { path = "crates/solver" }
import = { path = "crates/import" }
plugin = { path = "crates/plugin" }
icons = { path = "crates/icons" }

# Errors: thiserror in libraries, anyhow in binaries.
thiserror = "2.0.21"
anyhow = "1.0.104"

# Serialization.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
semver = "1.0.28"

# LP. The default backend (coin_cbc) needs a C toolchain, so it is off:
# microlp is pure Rust and keeps CI simple on all three platforms.
good_lp = { version = "1.15.3", default-features = false }

# Logging.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# GUI and CLI. Pinned to 0.36 because egui-snarl 0.12 builds against it;
# a newer egui would put two incompatible copies in the tree.
eframe = "0.36.0"
egui = "0.36.0"
egui-snarl = "0.12.0"
clap = { version = "4.6.7", features = ["derive"] }
rfd = "0.17.2"

[workspace.lints.rust]
unsafe_code = "forbid"
